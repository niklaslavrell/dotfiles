gui:
  nerdFontsVersion: "3"
  showIcons: true
customCommands:
  - key: "<c-p>"
    description: "Create PR (interactive)"
    command: "gh pr create"
    context: "global"
    loadingText: "Creating PR..."
    output: terminal
  - key: "<c-g>"
    description: "Open PR in browser"
    command: "gh pr view --web"
    context: "global"
    loadingText: "Opening PR on Github..."
  - key: "<c-l>"
    description: "Copy PR link to clipboard"
    command: >-
      gh pr view --json title,number,additions,deletions,url --template '{{`(+{{.additions}}/-{{.deletions}}) {{.title}} [#{{.number}}]({{.url}})`}}' | sed -e 's/(/`\(/' -e 's/)/&`/' | pbcopy
    context: "global"
    loadingText: "Copy nice PR link"
  - key: "v"
    description: "Checkout a PR"
    context: "localBranches"
    loadingText: "Checking out GitHub Pull Request..."
    command: "gh pr checkout {{.Form.PullRequestNumber}}"
    prompts:
      - type: "menuFromCommand"
        title: "Which PR do you want to check out?"
        key: "PullRequestNumber"
        command: >-
          gh pr list --json number,title,headRefName,updatedAt --template '{{`{{range .}}{{printf "#%v: %s - %s (%s)" .number .title .headRefName (timeago .updatedAt)}}{{end}}`}}'
        filter: '#(?P<number>[0-9]+): (?P<title>.+) - (?P<ref_name>[^ ]+).*'
        valueFormat: '{{.number}}'
        labelFormat: '{{"#" | black | bold}}{{.number | white | bold}} {{.title | yellow | bold}}{{" [" | black | bold}}{{.ref_name | green}}{{"]" | black | bold}}'
git:
  branchPrefix: "niklas/"

os:
  open: 'cursor {{filename}}'
  edit: 'cursor {{filename}}'
  editAtLine: 'cursor --goto {{filename}}:{{line}}'
  editAtLineAndWait: 'cursor --goto {{filename}}:{{line}} --wait'
  editInTerminal: false
